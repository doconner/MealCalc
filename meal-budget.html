<style>
  :root {
    --bg: #F3F4F1;
    --surface: #FFFFFF;
    --surface-2: #EBEDE8;
    --ink: #1E211D;
    --muted: #6E7269;
    --accent: #1F6F54;
    --accent-ink: #FFFFFF;
    --good: #1F6F54;
    --good-bg: #E4F1EB;
    --warn: #94600F;
    --warn-bg: #F7ECD8;
    --over: #A5362B;
    --over-bg: #F6E2DF;
    --border: #DCDFD8;
    --border-strong: #C4C8BF;
    --shadow: 0 1px 2px rgba(30,33,29,0.06), 0 8px 20px -12px rgba(30,33,29,0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14160F;
      --surface: #1D201A;
      --surface-2: #262A21;
      --ink: #ECEEE6;
      --muted: #9BA090;
      --accent: #4FBE94;
      --accent-ink: #0E1210;
      --good: #4FBE94;
      --good-bg: #1C3229;
      --warn: #E0A353;
      --warn-bg: #362A16;
      --over: #EF7A6E;
      --over-bg: #3A211E;
      --border: #333629;
      --border-strong: #43483A;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14160F;
    --surface: #1D201A;
    --surface-2: #262A21;
    --ink: #ECEEE6;
    --muted: #9BA090;
    --accent: #4FBE94;
    --accent-ink: #0E1210;
    --good: #4FBE94;
    --good-bg: #1C3229;
    --warn: #E0A353;
    --warn-bg: #362A16;
    --over: #EF7A6E;
    --over-bg: #3A211E;
    --border: #333629;
    --border-strong: #43483A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    overscroll-behavior-y: none;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    overscroll-behavior-y: none;
    padding-inline: calc(16px + env(safe-area-inset-left)) calc(16px + env(safe-area-inset-right));
    padding-block: calc(14px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-bottom));
  }
  h1, .num { font-variant-numeric: tabular-nums; }

  .app {
    max-width: 480px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---- Header / summary ticket ---- */
  .ticket {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px 20px 16px;
    position: relative;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .ticket::before {
    content: "";
    position: absolute;
    left: 20px; right: 20px; top: 0;
    border-top: 1.5px dashed var(--border-strong);
  }
  .ticket-label {
    font-size: 13px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .ticket-value {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(40px, 13vw, 52px);
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.01em;
    color: var(--good);
    transition: color .2s ease;
  }
  .ticket-value.state-warn { color: var(--warn); }
  .ticket-value.state-over { color: var(--over); }

  .ticket-breakdown {
    margin-top: 12px;
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18.5px;
    color: var(--muted);
  }
  .ticket-breakdown dl { display: flex; justify-content: space-between; gap: 5px; margin: 0; }
  .ticket-breakdown dt { color: var(--muted); }
  .ticket-breakdown dd { margin: 0; color: var(--ink); }

  .example-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14.5px;
    color: var(--muted);
  }
  .example-banner button {
    border: none;
    background: none;
    color: var(--accent);
    font-weight: 600;
    font-size: 14.5px;
    padding: 4px 6px;
    cursor: pointer;
  }

  .section-divider {
    border-top: 2px solid var(--border-strong);
    margin: 2px 0;
  }

  /* ---- Controls ---- */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .field {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 12px;
  }
  .field label {
    display: block;
    font-size: 12.5px;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .field .row {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .field .prefix, .field .suffix {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    font-size: 19px;
  }
  .field input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 21px;
    font-weight: 500;
    color: var(--ink);
    background: none;
    border: none;
    outline: none;
    width: 100%;
    padding: 2px 0;
    min-width: 0;
  }
  .field input:focus { color: var(--accent); }

  /* ---- Add row ---- */
  .add-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .add-row button {
    flex: 1 1 auto;
    min-width: 64px;
    min-height: 44px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-row button:active { background: var(--surface-2); }
  .add-row button .plus { color: var(--accent); margin-right: 3px; font-weight: 700; }

  /* ---- Items ---- */
  .items { display: flex; flex-direction: column; gap: 14px; }
  .group-heading {
    font-size: 13px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    padding-left: 2px;
  }
  .group { display: flex; flex-direction: column; gap: 8px; }

  .item-swipe {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
  }
  .swipe-action {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 84px;
    background: var(--over);
    color: #fff;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .item-row {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 10px;
    touch-action: pan-y;
    will-change: transform;
  }
  .item-row .label-input {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: var(--ink);
    background: none;
    border: none;
    outline: none;
    padding: 0;
    min-width: 0;
  }
  .item-row .label-input::placeholder { color: var(--muted); }

  .item-row .price-wrap {
    display: flex;
    align-items: baseline;
    gap: 2px;
  }
  .item-row .price-wrap .prefix {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    font-size: 17px;
  }
  .item-row .price-input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 19px;
    font-weight: 500;
    color: var(--ink);
    background: none;
    border: none;
    outline: none;
    width: 5.2ch;
    text-align: right;
    padding: 0;
  }
  .item-row .price-input:focus, .item-row .label-input:focus { color: var(--accent); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    padding: 18px 10px;
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
  }

  /* ---- Footer ---- */
  footer { display: flex; justify-content: center; }
  #resetBtn {
    min-height: 44px;
    padding: 0 20px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #resetBtn.confirming {
    background: var(--over-bg);
    border-color: var(--over);
    color: var(--over);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="example-banner" id="exampleBanner" hidden>
    <span>Example bill shown — edit away, or clear it</span>
    <button type="button" id="clearExampleBtn">Clear</button>
  </div>

  <div class="add-row" id="addRow">
    <button type="button" data-cat="Starter"><span class="plus">+</span>Starter</button>
    <button type="button" data-cat="Main"><span class="plus">+</span>Main</button>
    <button type="button" data-cat="Side"><span class="plus">+</span>Side</button>
    <button type="button" data-cat="Dessert"><span class="plus">+</span>Dessert</button>
    <button type="button" data-cat="Drink"><span class="plus">+</span>Drink</button>
  </div>

  <div class="items" id="itemsList"></div>

  <div class="section-divider"></div>

  <div class="controls">
    <div class="field">
      <label for="limitInput">Limit</label>
      <div class="row">
        <span class="prefix">£</span>
        <input id="limitInput" type="number" inputmode="decimal" step="0.01" min="0">
      </div>
    </div>
    <div class="field">
      <label for="serviceInput">Service</label>
      <div class="row">
        <input id="serviceInput" type="number" inputmode="decimal" step="0.5" min="0">
        <span class="suffix">%</span>
      </div>
    </div>
  </div>

  <div class="ticket">
    <div class="ticket-label">Left to spend</div>
    <div class="ticket-value num" id="remaining">£0.00</div>
    <div class="ticket-breakdown">
      <dl><dt>subtotal</dt><dd id="bdSubtotal">£0.00</dd></dl>
      <dl><dt>service</dt><dd id="bdService">£0.00</dd></dl>
      <dl><dt>total</dt><dd id="bdTotal">£0.00</dd></dl>
    </div>
  </div>

  <footer>
    <button type="button" id="resetBtn">New restaurant</button>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var CATS = ['Starter', 'Main', 'Side', 'Dessert', 'Drink'];
  var STORE_KEY = 'table-ledger-state-v2';
  var SWIPE_MAX = 84;

  function exampleState() {
    return {
      limit: 45,
      service: 12.5,
      isExample: true,
      items: [
        { id: 'ex1', cat: 'Starter', label: 'Burrata', price: 9.5 },
        { id: 'ex2', cat: 'Main', label: '', price: 18.5 },
        { id: 'ex3', cat: 'Main', label: '', price: 21 },
        { id: 'ex4', cat: 'Drink', label: 'House red', price: 7 }
      ]
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.items)) return parsed;
      }
    } catch (e) {}
    return exampleState();
  }

  var state = loadState();
  var nextId = 1;
  var openWrapper = null;

  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function money(n) {
    if (!isFinite(n)) n = 0;
    var sign = n < 0 ? '-' : '';
    return sign + '£' + Math.abs(n).toFixed(2);
  }

  function newId() {
    return 'i' + (Date.now().toString(36)) + (nextId++);
  }

  // ---------- DOM refs ----------
  var limitInput = document.getElementById('limitInput');
  var serviceInput = document.getElementById('serviceInput');
  var remainingEl = document.getElementById('remaining');
  var bdSubtotal = document.getElementById('bdSubtotal');
  var bdService = document.getElementById('bdService');
  var bdTotal = document.getElementById('bdTotal');
  var itemsList = document.getElementById('itemsList');
  var addRow = document.getElementById('addRow');
  var resetBtn = document.getElementById('resetBtn');
  var exampleBanner = document.getElementById('exampleBanner');
  var clearExampleBtn = document.getElementById('clearExampleBtn');

  function clearExampleFlag() {
    if (state.isExample) {
      state.isExample = false;
      exampleBanner.hidden = true;
      saveState();
    }
  }

  // ---------- totals ----------
  function updateTotals() {
    var subtotal = state.items.reduce(function (sum, it) {
      var p = parseFloat(it.price);
      if (!isFinite(p)) p = 0;
      return sum + p;
    }, 0);
    var servicePct = parseFloat(state.service);
    if (!isFinite(servicePct)) servicePct = 0;
    var service = subtotal * (servicePct / 100);
    var total = subtotal + service;
    var limit = parseFloat(state.limit);
    if (!isFinite(limit)) limit = 0;
    var remaining = limit - total;

    remainingEl.textContent = money(remaining);
    bdSubtotal.textContent = money(subtotal);
    bdService.textContent = money(service);
    bdTotal.textContent = money(total);

    remainingEl.classList.remove('state-warn', 'state-over');
    if (remaining < 0) {
      remainingEl.classList.add('state-over');
    } else if (limit > 0 && remaining <= limit * 0.15) {
      remainingEl.classList.add('state-warn');
    }
  }

  // ---------- delete ----------
  function deleteItem(id) {
    state.items = state.items.filter(function (it) { return it.id !== id; });
    clearExampleFlag();
    renderItems();
    updateTotals();
    saveState();
  }

  // ---------- items rendering ----------
  function renderItems() {
    itemsList.innerHTML = '';
    openWrapper = null;

    if (state.items.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No items yet — tap a category above to add one.';
      itemsList.appendChild(empty);
      return;
    }

    CATS.forEach(function (cat) {
      var groupItems = state.items.filter(function (it) { return it.cat === cat; });
      if (groupItems.length === 0) return;

      var heading = document.createElement('div');
      heading.className = 'group-heading';
      heading.textContent = cat + (groupItems.length > 1 ? ' (' + groupItems.length + ')' : '');
      itemsList.appendChild(heading);

      var group = document.createElement('div');
      group.className = 'group';

      groupItems.forEach(function (it) {
        group.appendChild(buildSwipeRow(it));
      });

      itemsList.appendChild(group);
    });
  }

  function buildSwipeRow(item) {
    var wrapper = document.createElement('div');
    wrapper.className = 'item-swipe';

    var action = document.createElement('button');
    action.type = 'button';
    action.className = 'swipe-action';
    action.textContent = 'Delete';
    action.setAttribute('aria-label', 'Delete item');
    action.addEventListener('click', function () { deleteItem(item.id); });

    var row = buildRow(item);

    wrapper.appendChild(action);
    wrapper.appendChild(row);
    bindSwipe(wrapper, row);

    return wrapper;
  }

  function buildRow(item) {
    var row = document.createElement('div');
    row.className = 'item-row';
    row.dataset.id = item.id;

    var labelInput = document.createElement('input');
    labelInput.type = 'text';
    labelInput.className = 'label-input';
    labelInput.id = 'label-' + item.id;
    labelInput.placeholder = item.cat + ' (optional note)';
    labelInput.value = item.label || '';
    labelInput.addEventListener('input', function () {
      item.label = labelInput.value;
      clearExampleFlag();
      saveState();
    });

    var priceWrap = document.createElement('div');
    priceWrap.className = 'price-wrap';
    var prefix = document.createElement('span');
    prefix.className = 'prefix';
    prefix.textContent = '£';
    var priceInput = document.createElement('input');
    priceInput.type = 'number';
    priceInput.inputMode = 'decimal';
    priceInput.step = '0.01';
    priceInput.min = '0';
    priceInput.className = 'price-input';
    priceInput.id = 'price-' + item.id;
    priceInput.value = item.price === 0 ? '' : item.price;
    priceInput.placeholder = '0.00';
    priceInput.addEventListener('focus', function () { priceInput.select(); });
    priceInput.addEventListener('input', function () {
      var v = parseFloat(priceInput.value);
      item.price = isFinite(v) ? v : 0;
      clearExampleFlag();
      updateTotals();
      saveState();
    });
    priceWrap.appendChild(prefix);
    priceWrap.appendChild(priceInput);

    row.appendChild(labelInput);
    row.appendChild(priceWrap);

    return row;
  }

  // ---------- swipe-to-delete ----------
  function bindSwipe(wrapper, row) {
    var startX = 0, startY = 0, dx = 0, active = false, horizontal = null, isOpen = false;

    function close(animate) {
      row.style.transition = animate === false ? 'none' : 'transform .18s ease';
      row.style.transform = 'translateX(0)';
      isOpen = false;
      if (openWrapper === wrapper) openWrapper = null;
    }
    function openFull() {
      row.style.transition = 'transform .18s ease';
      row.style.transform = 'translateX(-' + SWIPE_MAX + 'px)';
      isOpen = true;
      openWrapper = wrapper;
    }
    wrapper._swipeClose = close;

    function onStart(x, y) {
      if (openWrapper && openWrapper !== wrapper && openWrapper._swipeClose) {
        openWrapper._swipeClose();
      }
      startX = x; startY = y; dx = 0; active = true; horizontal = null;
      row.style.transition = 'none';
    }
    function onMove(x, y, ev) {
      if (!active) return;
      var diffX = x - startX, diffY = y - startY;
      if (horizontal === null && (Math.abs(diffX) > 6 || Math.abs(diffY) > 6)) {
        horizontal = Math.abs(diffX) > Math.abs(diffY);
      }
      if (horizontal === false) { active = false; return; }
      if (horizontal === true) {
        if (ev && ev.cancelable) ev.preventDefault();
        var base = isOpen ? -SWIPE_MAX : 0;
        var next = base + diffX;
        dx = Math.min(0, Math.max(-SWIPE_MAX - 24, next));
        row.style.transform = 'translateX(' + dx + 'px)';
      }
    }
    function onEnd() {
      if (!active) return;
      active = false;
      if (horizontal === true) {
        if (dx < -SWIPE_MAX * 0.5) openFull(); else close();
      }
    }

    row.addEventListener('touchstart', function (e) {
      var t = e.touches[0];
      onStart(t.clientX, t.clientY);
    }, { passive: true });
    row.addEventListener('touchmove', function (e) {
      var t = e.touches[0];
      onMove(t.clientX, t.clientY, e);
    }, { passive: false });
    row.addEventListener('touchend', onEnd);
    row.addEventListener('touchcancel', onEnd);
  }

  // ---------- add item ----------
  addRow.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-cat]');
    if (!btn) return;
    clearExampleFlag();
    var item = { id: newId(), cat: btn.dataset.cat, label: '', price: 0 };
    state.items.push(item);
    renderItems();
    updateTotals();
    saveState();
    var priceEl = document.getElementById('price-' + item.id);
    if (priceEl) {
      priceEl.focus();
      priceEl.select();
    }
  });

  // ---------- limit / service ----------
  limitInput.addEventListener('focus', function () { limitInput.select(); });
  limitInput.addEventListener('input', function () {
    var v = parseFloat(limitInput.value);
    state.limit = isFinite(v) ? v : 0;
    updateTotals();
    saveState();
  });
  serviceInput.addEventListener('focus', function () { serviceInput.select(); });
  serviceInput.addEventListener('input', function () {
    var v = parseFloat(serviceInput.value);
    state.service = isFinite(v) ? v : 0;
    updateTotals();
    saveState();
  });

  // ---------- reset ----------
  var confirmTimer = null;
  resetBtn.addEventListener('click', function () {
    if (resetBtn.classList.contains('confirming')) {
      clearTimeout(confirmTimer);
      resetBtn.classList.remove('confirming');
      resetBtn.textContent = 'New restaurant';
      state.items = [];
      state.isExample = false;
      exampleBanner.hidden = true;
      renderItems();
      updateTotals();
      saveState();
      limitInput.focus();
      limitInput.select();
    } else {
      resetBtn.classList.add('confirming');
      resetBtn.textContent = 'Tap again to clear items';
      confirmTimer = setTimeout(function () {
        resetBtn.classList.remove('confirming');
        resetBtn.textContent = 'New restaurant';
      }, 2500);
    }
  });

  clearExampleBtn.addEventListener('click', function () {
    state.items = [];
    state.isExample = false;
    exampleBanner.hidden = true;
    renderItems();
    updateTotals();
    saveState();
  });

  // ---------- boot ----------
  function boot(data) {
    if (data && Array.isArray(data.items)) state = data;
    limitInput.value = state.limit;
    serviceInput.value = state.service;
    exampleBanner.hidden = !state.isExample;
    renderItems();
    updateTotals();
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(function () { return state; });
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || state);
  } else {
    boot(state);
  }
})();
</script>
</body>
</html>
